<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Geo Location</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link rel="stylesheet" href="./css/index.css">
  </head>
  <body>
    <div class="container py-5">
      <div class="text-center mb-4">
        <h1>Geo Dashboard</h1>
        <button id="btn" class="btn btn-primary btn-lg">
          Dapatkan Lokasi Saya
        </button>
      </div>
      <div id="spinner" class="text-center d-none">
        <div class="spinner-border"></div>
      </div> 
      <div id="cards" class="row g-4 d-none">
        
        <div class="col-md-6">
          <div class="card-show h-100">
            <div class="card-body" id="loc"></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card-show h-100">
            <div class="card-body" id="addr"></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card-show h-100">
            <div class="card-body" id="weather"></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card-show h-100">
            <div class="card-body" id="country"></div>
          </div>
        </div>

      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
